[package]
name = "codex-fast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
quick-xml = { version = "0.41", default-features = false }

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
